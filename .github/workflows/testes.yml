name: Testes

on:
  push:
    branches: [main]
  pull_request:

# Só leitura: o fluxo apenas baixa o código e roda testes
permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch (não gasta minutos à toa)
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # o teste de cache-bust compara com a data dos commits

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instala as dependências dos testes
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Instala o Chromium do Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Lint (ESLint)
        working-directory: tests
        run: npm run lint

      - name: Verificações estáticas (assets, index.html, música, itens)
        working-directory: tests
        run: npm test

      - name: Teste de fumaça no navegador
        working-directory: tests
        run: npm run test:smoke
