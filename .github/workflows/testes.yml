name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o teste de cache-bust compara com a data dos commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala as dependências dos testes
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Instala o Chromium do Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Verificações estáticas (assets, index.html, música, itens)
        working-directory: tests
        run: npm test

      - name: Teste de fumaça no navegador
        working-directory: tests
        run: npm run test:smoke
