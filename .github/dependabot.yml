# Atualizações automáticas (um PR por semana): GitHub Actions e dependências dos testes.
# O jogo em si não tem dependências npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
